<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>クミナゾCLEAR</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      text-align: center;
    }

    /* クリア画像 */
    .clear-image {
      width: 100vw;
      aspect-ratio: 1/1;
    }

    .clear-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* アンケートボタン */
    .survey-button {
      display: inline-block;
      margin-top: 20px;
      padding: 18px 30px;
      font-size: 18px;
      color: white;
      background: #4285f4;
      text-decoration: none;
      border-radius: 10px;
    }

    /* QRコードの大きさと配置*/
    .qr-code {
      text-align: center;
      margin: 10px auto;
    }

    .qr-code-caption {
      font-size: 13px;
      margin-bottom: 0;
      margin-top: 0;
      color: #333;
      line-height: 1.2;
    }

    .qr-code img {
      width: 155px;
      max-width: 100%;
      height: auto;
    }

  </style>

</head>

<body>

  <div class="clear-image">
    <img src="./assets/images/CLEAR.webp" alt="クミナゾCLEAR">
  </div>

  <a class="survey-button" href="https://forms.gle/2WziboUuQCVS4fhZA">
    アンケートはこちら
  </a>

  <div class="qr-code">
    <p class="qr-code-caption">
      ↓こちらからでもアクセスできます
    </p>
    <img src="./assets/images/SHERLOCKHOMEQR.png" alt="アンケートのQRコード">
  </div>

</body>

</html>
